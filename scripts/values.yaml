manager:
  replicas: 1
  image:
    repository: dragonflyoss/manager
  metrics:
    enable: true
scheduler:
  replicas: 1
  image:
    repository: dragonflyoss/scheduler
  metrics:
    enable: true
seedClient:
  replicas: 2
  image:
    repository: dragonflyoss/client
  metrics:
    enable: true
client:
  image:
    repository: dragonflyoss/client
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
  metrics:
    enable: true
  dfinit:
    enable: false
  # Ensure dfdaemon output path exists for RIID outputPath=/var/run/dragonfly/output/p2p-*.bin
  extraVolumes:
    - name: dragonfly-output
      hostPath:
        path: /var/run/dragonfly/output
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: dragonfly-output
      mountPath: /var/run/dragonfly/output
redis:
  replica:
    replicaCount: 1
