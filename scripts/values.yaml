manager:
  replicas: 1
  image:
    repository: dragonflyoss/manager
    tag: latest
  metrics:
    enable: true
scheduler:
  replicas: 1
  image:
    repository: dragonflyoss/scheduler
    tag: latest
  metrics:
    enable: true
seedClient:
  replicas: 2
  image:
    repository: dragonflyoss/client
    tag: latest
  metrics:
    enable: true
client:
  image:
    repository: dragonflyoss/client
    tag: latest
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
  metrics:
    enable: true
  dfinit:
    enable: false
  # Ensure dfdaemon output path exists for RIID outputPath=/var/run/dragonfly/output/p2p-*.bin
  extraVolumes:
    - name: dragonfly-run-tmpfs
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
    - name: dragonfly-output
      hostPath:
        path: /var/run/dragonfly/output
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: dragonfly-run-tmpfs
      mountPath: /run/dragonfly
    - name: dragonfly-output
      mountPath: /var/run/dragonfly/output
redis:
  replica:
    replicaCount: 1
