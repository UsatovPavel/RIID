manager:
  replicas: 1
  image:
    repository: dragonflyoss/manager
    tag: latest
  metrics:
    enable: true
scheduler:
  replicas: 1
  image:
    repository: dragonflyoss/scheduler
    tag: latest
  metrics:
    enable: true
seedClient:
  replicas: 2
  image:
    repository: dragonflyoss/client
    tag: latest
  metrics:
    enable: true
client:
  image:
    repository: dragonflyoss/client
    tag: latest
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
  metrics:
    enable: true
  dfinit:
    enable: false
  # dfdaemon hardlinks a finished task from storage.dir into the requested
  # outputPath (RIID outputPath=/var/run/dragonfly/output/p2p-*.bin); hardlink
  # requires both paths on the same filesystem, so storage.dir is moved onto
  # the same hostPath (/var/run/dragonfly, already mounted for the socket)
  # instead of the image default /var/lib/dragonfly/ (container-local overlay,
  # a different device -> "Invalid cross-device link" os error 18).
  config:
    storage:
      dir: /var/run/dragonfly/data/
  extraVolumes:
    - name: dragonfly-run-tmpfs
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
  extraVolumeMounts:
    - name: dragonfly-run-tmpfs
      mountPath: /run/dragonfly
redis:
  replica:
    replicaCount: 1
