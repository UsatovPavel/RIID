manager:
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
              - key: riid.registry
                operator: DoesNotExist
  image:
    repository: dragonflyoss/manager
    tag: latest
  metrics:
    enable: true
scheduler:
  replicas: 2
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
              - key: riid.registry
                operator: DoesNotExist
  image:
    repository: dragonflyoss/scheduler
    tag: latest
  metrics:
    enable: true
seedClient:
  replicas: 10
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
              - key: riid.registry
                operator: DoesNotExist
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              component: seed-client
          topologyKey: kubernetes.io/hostname
  image:
    repository: dragonflyoss/client
    tag: latest
  metrics:
    enable: true
client:
  image:
    repository: dragonflyoss/client
    tag: latest
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
              - key: riid.registry
                operator: DoesNotExist
  metrics:
    enable: true
  dfinit:
    enable: false
  # Ensure dfdaemon output path exists for RIID outputPath=/var/run/dragonfly/output/p2p-*.bin
  extraVolumes:
    - name: dragonfly-run-tmpfs
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
    - name: dragonfly-output
      hostPath:
        path: /var/lib/dragonfly/output
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: dragonfly-run-tmpfs
      mountPath: /run/dragonfly
    - name: dragonfly-output
      mountPath: /var/run/dragonfly/output
mysql:
  primary:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: riid.monitoring
                  operator: DoesNotExist
                - key: riid.registry
                  operator: DoesNotExist
redis:
  replica:
    replicaCount: 1
  master:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: riid.monitoring
                  operator: DoesNotExist
                - key: riid.registry
                  operator: DoesNotExist
  replica:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: riid.monitoring
                  operator: DoesNotExist
                - key: riid.registry
                  operator: DoesNotExist
