manager:
  replicas: 1
  image:
    repository: dragonflyoss/manager
    tag: v2.4.4-rc.1
  metrics:
    enable: true
scheduler:
  replicas: 1
  image:
    repository: dragonflyoss/scheduler
    tag: v2.4.4-rc.1
  metrics:
    enable: true
seedClient:
  replicas: 2
  image:
    repository: dragonflyoss/client
    tag: v1.3.8
  metrics:
    enable: true
client:
  image:
    repository: dragonflyoss/client
    tag: v1.3.8
  # A dfdaemon on an infra node is a peer that never pulls: it skews the mesh and
  # the seed tier without ever being measured.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
              - key: riid.registry
                operator: DoesNotExist
              - key: riid.dragonfly.scheduler
                operator: DoesNotExist
              - key: riid.dragonfly.manager
                operator: DoesNotExist
  metrics:
    enable: true
  dfinit:
    # Off here on purpose: dfinit rewrites the node's registry config and
    # restarts the container runtime, which a bare or riid arm must not get -
    # and CI installs this same file on the runner itself. install-dragonfly.sh
    # turns it on for the engine named by RIID_DFINIT_ENGINE.
    enable: false
    image:
      repository: dragonflyoss/dfinit
      tag: v1.3.8
    config:
      proxy:
        addr: http://127.0.0.1:4001
      # containerRuntime is rendered per engine by install-dragonfly.sh. A static
      # block here was live for every arm, not just dfinit-*: the containerd one
      # crashlooped the whole client DaemonSet and the crio one carried a dead
      # stand's registry address (10.96.5.146).
  # dfdaemon hardlinks a finished task from storage.dir into the requested
  # outputPath (RIID outputPath=/var/run/dragonfly/output/p2p-*.bin); hardlink
  # requires both paths on the same filesystem, so storage.dir is moved onto
  # the same hostPath (/var/run/dragonfly, already mounted for the socket)
  # instead of the image default /var/lib/dragonfly/ (container-local overlay,
  # a different device -> "Invalid cross-device link" os error 18).
  config:
    storage:
      dir: /var/run/dragonfly/data/
  # AGENT-99: the dragonfly-run-tmpfs emptyDir that used to be mounted at
  # /run/dragonfly is removed. In the container /var/run is a symlink to /run,
  # so that mount shadowed the socket-dir hostPath at the same path and pushed
  # both dfdaemon.sock and storage.dir back onto a RAM disk. Ubuntu sizes /run
  # at 10% of RAM (873 MB on an 8 GB node), so every image larger than that
  # failed with "no space left on device: not enough space to store the task"
  # and silently fell back to the registry - P2P could never serve a big layer.
# Node pinning for manager/scheduler/mysql/redis lives in
# deploy/k8s/src/dragonfly/values-dedicated-infra.yaml: CI installs this same
# file on a single-node minikube that has no infra labels.
redis:
  replica:
    replicaCount: 1
