manager:
  replicas: 1
  image:
    repository: dragonflyoss/manager
    tag: v2.4.4-rc.1
  metrics:
    enable: true
scheduler:
  replicas: 1
  image:
    repository: dragonflyoss/scheduler
    tag: v2.4.4-rc.1
  metrics:
    enable: true
seedClient:
  replicas: 2
  image:
    repository: dragonflyoss/client
    tag: v1.3.8
  metrics:
    enable: true
  config:
    # AGENT-99: 60/45 was still far too high. On a 79 GB worker that lets the
    # cache reach ~47 GB before GC runs - four times the 11.46 GiB dataset - and
    # it shares the disk with containerd's store and RIID's work dir. aibox2
    # then sits below the 27 GB the preflight needs and every arm is blocked or
    # evicted mid-run. 25/15 caps it near the dataset's own size.
    # Original note: the chart default (distHighThresholdPercent 90,
    # taskTTL 720h) only starts reclaiming disk once the node is already at 90%
    # full - well past kubelet's own DiskPressure eviction, which fired at
    # ~85% (11.77 GiB free out of 79 GiB) and evicted the riid pod mid-arm
    # ("pods not found"). On this node the seed-client's own PVC content
    # (/opt/local-path-provisioner/...) competes for the same disk as
    # containerd's content+snapshot store and dfdaemon's client cache, so GC
    # has to trigger well before kubelet's threshold, not after it.
    gc:
      interval: 60s
      policy:
        distHighThresholdPercent: 25
        distLowThresholdPercent: 15
        taskTTL: 1h
client:
  image:
    repository: dragonflyoss/client
    tag: v1.3.8
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: riid.monitoring
                operator: DoesNotExist
  metrics:
    enable: true
  dfinit:
    # AGENT-99 dfinit-podman arm: dfinit rewrites the node's
    # /etc/containers/registries.conf so podman resolves pulls through
    # dfdaemon's proxy instead of going straight to the registry.
    enable: true
    restartContainerRuntime: true
    image:
      repository: dragonflyoss/dfinit
      tag: v1.3.8
    config:
      proxy:
        addr: http://127.0.0.1:4001
      containerRuntime:
        # dfinit v1.3.8 has no `podman` handler - a podman section is silently
        # ignored (its log never mentions podman). podman reads the same
        # /etc/containers/registries.conf as CRI-O, so the crio handler is what
        # actually rewrites the file the podman arm needs.
        #
        # AGENT-99 riid-containerd (2026-09-04): containerd is nulled out again.
        # dfinit.enable is unconditional and RIID_DFINIT_ENGINE is not actually
        # read by any script (grep confirms it - install-dragonfly.sh and
        # render-values-from-infra.sh never touch it), so a non-null containerd
        # block here is live on every dragonfly-client pod for every arm, not
        # just dfinit-containerd. It was live for the first time today (an
        # earlier helm upgrade had never picked up this file's change) and
        # crashlooped the whole client DaemonSet on all nodes with "failed to
        # run container runtime: Is a directory (os error 21)" - a real bug in
        # the dfinit containerd handler, still unfixed, that took down P2P for
        # riid-containerd, a plain non-dfinit arm. The dfinit-containerd arm
        # needs a real ENGINE-gated render (e.g. render-values-from-infra.sh
        # nulling this block unless RIID_DFINIT_ENGINE=containerd) before it can
        # be attempted again - reinstating this static block is not enough by
        # itself, since it still needs the "Is a directory" error root-caused.
        containerd: null
        crio:
          configPath: /etc/containers/registries.conf
          unqualifiedSearchRegistries: ["cr.selcloud.ru"]
          registries:
            # Node-side engines resolve names in the host netns, where the
            # cluster DNS does not exist - the local registry has to be named
            # by its Service ClusterIP.
            - prefix: 10.96.5.146:5000
              location: 10.96.5.146:5000
  # dfdaemon hardlinks a finished task from storage.dir into the requested
  # outputPath (RIID outputPath=/var/run/dragonfly/output/p2p-*.bin); hardlink
  # requires both paths on the same filesystem, so storage.dir is moved onto
  # the same hostPath (/var/run/dragonfly, already mounted for the socket)
  # instead of the image default /var/lib/dragonfly/ (container-local overlay,
  # a different device -> "Invalid cross-device link" os error 18).
  config:
    storage:
      dir: /var/run/dragonfly/data/
    # AGENT-99 riid-containerd: same reasoning as seedClient.config.gc above -
    # the chart default (90% threshold, 720h TTL) never reclaims dfdaemon's own
    # cache before kubelet's node-level DiskPressure eviction fires first.
    gc:
      interval: 60s
      policy:
        distHighThresholdPercent: 25
        distLowThresholdPercent: 15
        taskTTL: 1h
    # AGENT-99: dfinit points podman's mirror at this proxy, but the proxy's own
    # upstream defaulted to https://index.docker.io - so a pull of
    # 10.96.5.146:5000/riid/... was forwarded to Docker Hub, missed, and podman
    # silently fell back to the direct address. The dfinit arm then measured
    # plain podman: dfdaemon logged zero download tasks and the arm's wall time
    # matched the bare baseline. The upstream has to be the registry under test.
    proxy:
      registryMirror:
        addr: http://10.96.5.146:5000
  # AGENT-99: the dragonfly-run-tmpfs emptyDir that used to be mounted at
  # /run/dragonfly is removed. In the container /var/run is a symlink to /run,
  # so that mount shadowed the socket-dir hostPath at the same path and pushed
  # both dfdaemon.sock and storage.dir back onto a RAM disk. Ubuntu sizes /run
  # at 10% of RAM (873 MB on an 8 GB node), so every image larger than that
  # failed with "no space left on device: not enough space to store the task"
  # and silently fell back to the registry - P2P could never serve a big layer.
redis:
  replica:
    replicaCount: 1
