# Minikube 2-node: TCP gRPC для RIID + shared output dir (minikube mount)
# hostNetwork: false — поды получают pod IP (10.42.x.x), advertise IP будет корректным для P2P
# Использовать: helm install ... -f values.yaml -f values-minikube-2nodes.yaml
client:
  hostNetwork: true
  config:
    download:
      downloadGRPC:
        listen: 0.0.0.0:65001
  extraVolumes:
    - name: riid-output
      hostPath:
        path: /tmp/riid-output
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: riid-output
      mountPath: /tmp/riid-output
