name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "buildSrc/**"
      - "gradle/**"
      - "config/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "src/**"
      - "buildSrc/**"
      - "gradle/**"
      - "config/**"
      - "scripts/**"
      - "deploy/**"

permissions:
  contents: read
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with: &java-setup
          distribution: temurin
          java-version: 23
          cache: gradle
      - name: Code quality (checkstyle/pmd/spotbugs + reports)
        run: ./gradlew allReports

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: *java-setup
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test -PdisableLocal

  linux-integration-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: *java-setup
      - name: Make gradlew executable
        run: chmod +x gradlew
      # Background apt-daily timers can hold the dpkg/apt lock and make apt-get hang
      # silently (no output) for the rest of the job's timeout; stop them first.
      - name: Disable background apt timers
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrade 2>/dev/null || true
      # Runner image already ships Docker (Moby); apt docker.io conflicts with containerd.io — do not install it.
      - name: Install Podman
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3
          sudo apt-get install -y -o DPkg::Lock::Timeout=60 podman
          podman --version
      - name: Ensure Docker CLI and socket
        run: |
          docker --version
          sudo systemctl start docker 2>/dev/null || sudo service docker start 2>/dev/null || true
          sudo chmod 666 /var/run/docker.sock 2>/dev/null || true
      - name: Podman and Docker runtime integration tests (Hub pull + load)
        run: |
          ./gradlew --no-daemon integrationTest \
            --tests 'riid.integration.runtime_app.PodmanRuntimeAdapterIntegrationTest' \
            --tests 'riid.integration.runtime_app.DockerRuntimeAdapterIntegrationTest'
      - name: Setup minikube (driver=none)
        run: |
          chmod +x scripts/ci-dragonfly-setup.sh
          ./scripts/ci-dragonfly-setup.sh
      - name: Install Dragonfly
        run: |
          KUBECONFIG=$HOME/.kube/config make -C scripts _helm-install _output-dir
      - name: Wait for dfdaemon socket
        run: |
          for i in $(seq 1 30); do
            if [ -S /var/run/dragonfly/dfdaemon.sock ]; then
              sudo chmod 666 /var/run/dragonfly/dfdaemon.sock 2>/dev/null || true
              echo "dfdaemon socket ready"
              break
            fi
            echo "Waiting for dfdaemon socket... ($i/30)"
            sleep 2
          done
          test -S /var/run/dragonfly/dfdaemon.sock || (echo "dfdaemon socket not found"; KUBECONFIG=$HOME/.kube/config kubectl get pods -n dragonfly-system -o wide; exit 1)
      - name: Linux integration tests (Dragonfly P2P + daemon UDS)
        run: |
          DFDAEMON_ADDR=unix:///var/run/dragonfly/dfdaemon.sock \
            ./gradlew --no-daemon integrationTest \
            --tests riid.integration.p2p.DragonflySingleP2PExecutorTest
          ./gradlew --no-daemon moduledTest \
            --tests riid.app.daemon.DaemonPullUnixSocketTest

  porto-integration-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PORTO_RELEASE_REPO: UsatovPavel/porto
      PORTO_DEB_VERSION: 5.3.58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: *java-setup
      - name: Make gradlew executable
        run: chmod +x gradlew
      # Background apt-daily timers can hold the dpkg/apt lock and make apt-get hang
      # silently (no output) for the rest of the job's timeout; stop them first.
      - name: Disable background apt timers
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrade 2>/dev/null || true
      - name: Install Porto from GitHub release (.deb jammy)
        run: |
          set -eux
          DEB="porto_jammy_${PORTO_DEB_VERSION}_amd64.deb"
          curl -fLO "https://github.com/${PORTO_RELEASE_REPO}/releases/download/v${PORTO_DEB_VERSION}/${DEB}"
          sudo apt-get update -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3
          sudo apt-get install -y -o DPkg::Lock::Timeout=60 "./${DEB}"
      - name: Start porto
        run: |
          sudo systemctl daemon-reload
          sudo systemctl start porto || sudo service porto start
      - name: Install Podman
        run: |
          sudo apt-get install -y -o DPkg::Lock::Timeout=60 podman
          podman --version
      # Runner user has no Porto layer-import ACL; JVM as root matches operations that invoke portoctl successfully.
      - name: Porto runtime integration tests
        run: |
          sudo -E ./gradlew --no-daemon integrationTest \
            --tests 'riid.integration.runtime_app.PortoRuntimeAdapterIntegrationTest'
          sudo chown -R runner:runner "$GITHUB_WORKSPACE"

  containerd-integration-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: *java-setup
      - name: Make gradlew executable
        run: chmod +x gradlew
      # Runner image already ships Docker (Moby) with bundled containerd.io (ctr CLI + containerd.sock).
      - name: Ensure containerd is running
        run: |
          ctr --version
          sudo systemctl start containerd 2>/dev/null || sudo service containerd start 2>/dev/null || true
          test -S /run/containerd/containerd.sock
      # containerd.sock is root:root; JVM as root matches operations that invoke ctr successfully (same approach as Porto).
      - name: Containerd runtime integration tests
        run: |
          sudo -E ./gradlew --no-daemon integrationTest \
            --tests 'riid.integration.runtime_app.ContainerdRuntimeAdapterIntegrationTest'
          sudo chown -R runner:runner "$GITHUB_WORKSPACE"

  # Выпуск образа. Мерж в main поднимает patch у последнего тега vX.Y.Z, push самого тега
  # публикует ровно его. Git-тег ставится только после успешного push образа, чтобы упавшая
  # сборка не сжигала номер версии. Тег, отправленный GITHUB_TOKEN, не порождает новый прогон
  # workflow, поэтому повторного запуска этой же джобы по триггеру tags не происходит.
  release-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-image
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: ver
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            [ -n "$LATEST" ] || LATEST="v0.0.0"
            BASE="${LATEST#v}"
            MAJ="$(printf '%s' "$BASE" | cut -d. -f1)"
            MIN="$(printf '%s' "$BASE" | cut -d. -f2)"
            PAT="$(printf '%s' "$BASE" | cut -d. -f3)"
            # Занятые номера пропускаются: у части старых тегов четыре компонента (v0.3.6.1),
            # и усечение до трёх может попасть в уже существующий тег.
            PAT=$((PAT + 1))
            while git rev-parse -q --verify "refs/tags/v${MAJ}.${MIN}.${PAT}" >/dev/null; do
              PAT=$((PAT + 1))
            done
            TAG="v${MAJ}.${MIN}.${PAT}"
            echo "Последний тег $LATEST -> новый $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push k8s image
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER_LC}/riid"
          docker build -f deploy/k8s/src/riid/Dockerfile.k8s \
            --build-arg GITHUB_ACTOR="${GITHUB_ACTOR}" \
            --build-arg GITHUB_PACKAGES_TOKEN="${GITHUB_PACKAGES_TOKEN}" \
            -t "${IMAGE}:${TAG}" \
            .
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -lc \
            'command -v curl >/dev/null && ! command -v podman >/dev/null 2>&1 && command -v jq >/dev/null'
          docker push "${IMAGE}:${TAG}"
          echo "Pushed ${IMAGE}:${TAG}"
          sudo chown -R runner:runner "$GITHUB_WORKSPACE"

      - name: Tag the released commit
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
