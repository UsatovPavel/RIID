# Prometheus-compatible scrape config for vmagent.
# Pass to vmagent: -promscrape.config=/path/to/vmagent-scrape.yaml
#
# Scrapes RIID daemon metrics (TCP GET /metrics). Bind is app.daemon.metricsHost / metricsPort
# in the RIID YAML (see docs/config.md); defaults 0.0.0.0:9090.
#
# Target: host where RIID daemon listens (defaults 0.0.0.0:9090).
# Use host.docker.internal when vmagent runs in Docker on WSL2 / Docker Desktop:
# 127.0.0.1 inside the container is NOT the WSL host where java runs.
# For vmagent on bare metal with --network host, use 127.0.0.1:9090 instead.

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: riid-daemon
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "host.docker.internal:9090"
