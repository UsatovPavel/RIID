#при любом изменении файла менять тест на его загрузку
client:
  http:
    connectTimeout: "PT5S"
    requestTimeout: "PT30S"
    maxRetries: 2
    initialBackoff: "PT0.2S"
    maxBackoff: "PT2S"
    backoffExponentBase: 2
    retryIdempotentOnly: true
    userAgent: "riid-client"
    followRedirects: true
  partialDownloading:
    mode: AUTO
    partialDigestValidation: SKIP
    retryWithoutRangeOnUnsatisfiableRange: true
  auth:
    defaultTokenTtlSeconds: 300
    certPath: null
    keyPath: null
    caPath: null
  registries:
    - scheme: "https"
      host: "registry-1.docker.io"
      port: -1
      credentials: null

dispatcher:
  maxConcurrentRegistry: 4
