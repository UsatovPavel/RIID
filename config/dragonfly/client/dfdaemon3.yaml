manager:
  addr: "http://dfmanager:65003"

scheduler:
  announceInterval: 10s
  scheduleTimeout: 3h
  enableBackToSource: true

host:
  hostname: "dfdaemon3"

server:
  cacheDir: .dragonfly/cache

storage:
  dir: .dragonfly/data
  server:
    tcpPort: 65035
    quicPort: 65036

download:
  server:
    socketPath: /tmp/dfdaemon3.sock
  protocol: tcp
  concurrentPieceCount: 8
  pieceTimeout: 30s

upload:
  server:
    port: 4003

proxy:
  server:
    port: 65031

metrics:
  server:
    port: 65032

health:
  server:
    port: 65033

stats:
  server:
    port: 65034

gc:
  interval: 3600s
  policy:
    taskTTL: 720h
    persistentTaskTTL: 720h
    persistentCacheTaskTTL: 720h
