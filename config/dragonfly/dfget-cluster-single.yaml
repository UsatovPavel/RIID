# Single-node cluster: manager + scheduler + one dfdaemon (prod-like).
# Socket for RIID: -v /tmp/dragonfly-sock:/var/run
manager:
  addr: http://dfmanager:65003
download:
  protocol: tcp
  server:
    socketPath: /var/run/dfdaemon.sock
daemon:
  dataDir: /var/lib/dragonfly
  cacheDir: /var/cache/dragonfly
scheduler:
  netAddrs:
    - "dfscheduler:65002"
  enableBackToSource: true
