namespace: riid-system

victoriaMetrics:
  image: docker.io/victoriametrics/victoria-metrics:v1.142.0
  pullPolicy: IfNotPresent

grafana:
  image: docker.io/grafana/grafana-oss:13.0.1
  pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: admin

monitoringNodeAffinity:
  required: true

kubeStateMetrics:
  enabled: true
  image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
  pullPolicy: IfNotPresent
  # Without this, kube_pod_labels omits pod labels and Grafana joins (app.kubernetes.io/name) return no data.
  metricLabelsAllowlist: "pods=[app.kubernetes.io/name]"
