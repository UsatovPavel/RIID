{{- if .Values.kubeStateMetrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: exporter
    {{- include "riid-observer.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/component: exporter
    spec:
      automountServiceAccountToken: true
      serviceAccountName: kube-state-metrics
      {{- if .Values.monitoringNodeAffinity.required }}
      affinity:
        {{- include "riid-observer.monitoringAffinity" . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-state-metrics
          image: {{ .Values.kubeStateMetrics.image | quote }}
          imagePullPolicy: {{ .Values.kubeStateMetrics.pullPolicy }}
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
            - name: telemetry
              containerPort: 8081
              protocol: TCP
          {{- if .Values.kubeStateMetrics.metricLabelsAllowlist }}
          args:
            - "--metric-labels-allowlist={{ .Values.kubeStateMetrics.metricLabelsAllowlist }}"
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
{{- end }}
