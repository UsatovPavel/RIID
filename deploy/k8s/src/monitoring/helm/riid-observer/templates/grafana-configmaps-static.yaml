{{- /*
  Datasource for in-cluster VictoriaMetrics Service DNS name `victoria-metrics`.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    {{- include "riid-observer.labels" . | nindent 4 }}
data:
  victoriametrics.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics:8428
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    {{- include "riid-observer.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: riid
        orgId: 1
        folder: RIID
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
