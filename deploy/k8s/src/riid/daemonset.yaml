apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: riid
  namespace: riid-system
  labels:
    app.kubernetes.io/name: riid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: riid
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riid
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: riid.monitoring
                    operator: DoesNotExist
                  - key: riid.registry
                    operator: DoesNotExist
      # Если Secret riid-config-secret существует, его config.yaml копируется в emptyDir; иначе — из ConfigMap riid-config.
      initContainers:
        - name: pick-riid-config
          image: riid.daemonset.init_busybox
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ -f /sec/config.yaml ]; then
                cp /sec/config.yaml /work/config.yaml
              else
                cp /cm/config.yaml /work/config.yaml
              fi
              chmod 644 /work/config.yaml
          volumeMounts:
            - name: riid-work
              mountPath: /work
            - name: riid-config-cm
              mountPath: /cm
            - name: riid-config-secret
              mountPath: /sec
      containers:
        - name: riid
          image: riid.daemonset.riid
          imagePullPolicy: IfNotPresent
          # No added capabilities: SYS_ADMIN/MKNOD were there for the in-pod
          # podman graph driver (overlay mounts, device nodes). The pod no
          # longer unpacks anything — every engine is a daemon on the node.
          env:
            - name: RIID_CONFIG
              value: /etc/riid/config.yaml
            # PodmanRuntimeAdapter sends Libpod HTTP requests directly over this
            # Unix socket; no podman client binary is installed in the RIID image.
            - name: CONTAINER_HOST
              value: unix:///run/podman/podman.sock
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: riid-work
              mountPath: /etc/riid/config.yaml
              subPath: config.yaml
            - name: dragonfly-sock
              mountPath: /var/run/dragonfly
            # RIID derives the dfdaemon output path from the socket path
            # (<dir>/output/p2p-*.bin) and never creates it; dfdaemon writes the
            # finished blob there. Both sides must therefore see one host
            # directory, and it must not be the tmpfs behind /var/run — see
            # client.extraVolumes in scripts/values.yaml.
            - name: dragonfly-output
              mountPath: /var/run/dragonfly/output
            - name: podman-sock
              mountPath: /run/podman/podman.sock
            # RIID => Containerd arm: ContainerdRuntimeAdapter runs `ctr`, which
            # talks gRPC to the node's containerd — the very daemon kubelet uses,
            # so nothing extra is installed on the node. The binary itself is in
            # the RIID image; only the socket has to be handed in.
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
            # ContainerdRuntimeAdapter shells out to `ctr`, which the RIID image
            # does not ship. Mount the node's own binary rather than baking one
            # in: that way it always matches the containerd the node runs, and a
            # version skew cannot silently break the containerd arms.
            - name: ctr-bin
              mountPath: /usr/local/bin/ctr
              readOnly: true
            # RIID => Porto arm: PortoRuntimeAdapter runs `portoctl`, which
            # talks to the node's portod over this socket (performance/backend
            # /engine/porto.inc.sh documents the same requirement for the bare
            # -porto bench arm). portoctl itself ships in the RIID image
            # (Dockerfile.k8s); only the socket has to be handed in, same
            # shape as podman/containerd above.
            - name: portod-sock
              mountPath: /run/portod.socket
            # Prefix import hands the node's podman a PATH, not a stream:
            # PodmanIncrementalImport runs `podman pull` against the OCI layout
            # under this directory, and podman resolves that path in the NODE's
            # filesystem. An emptyDir is visible only inside this pod, so every
            # incremental import dies with "lstat /var/lib/riid/work: no such
            # file or directory". The plain (non-prefix) path tars and streams
            # over the socket and does not care, which is why only the prefix
            # arm broke. Same path on both sides is therefore required.
            - name: riid-work
              mountPath: /var/lib/riid/work
      volumes:
        - name: riid-work
          hostPath:
            path: /var/lib/riid/work
            type: DirectoryOrCreate
        - name: riid-config-cm
          configMap:
            name: riid-config
        - name: riid-config-secret
          secret:
            secretName: riid-config-secret
            optional: true
        - name: dragonfly-sock
          hostPath:
            # Must match the socket dir the dragonfly-client DaemonSet mounts
            # (see patch-dragonfly-client-hostip.sh). The chart default puts it
            # under /run, which is tmpfs - the P2P cache is then capped by RAM
            # and a full /run stops every container on the node from starting.
            path: /var/lib/dragonfly-run
            type: DirectoryOrCreate
        # Must be the SAME host directory dfdaemon actually writes finished
        # blobs to. dragonfly-client's only volume for this tree is hostPath
        # /var/run/dragonfly -> container /var/run/dragonfly (see
        # client-daemonset.yaml's "config"/"socket-dir" mounts), so its
        # container path /var/run/dragonfly/output is host
        # /var/run/dragonfly/output, not a path under /var/lib. Pointing this
        # volume at a different host path (previously
        # /var/lib/dragonfly/riid/output) made every P2P download report
        # "download task finished but output file missing" on the RIID side
        # even though dfdaemon's own logs showed the hard link succeeding:
        # RIID and dfdaemon were reading two different directories.
        - name: dragonfly-output
          hostPath:
            path: /var/lib/dragonfly-run/output
            type: DirectoryOrCreate
        - name: podman-sock
          hostPath:
            path: /run/podman/podman.sock
            type: Socket
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: ctr-bin
          hostPath:
            path: /usr/bin/ctr
            type: File
        - name: portod-sock
          hostPath:
            path: /run/portod.socket
            type: Socket
