apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: riid
  namespace: riid-system
  labels:
    app.kubernetes.io/name: riid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: riid
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riid
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: riid.monitoring
                    operator: DoesNotExist
                  - key: riid.registry
                    operator: DoesNotExist
      # Если Secret riid-config-secret существует, его config.yaml копируется в emptyDir; иначе — из ConfigMap riid-config.
      initContainers:
        - name: pick-riid-config
          image: riid.daemonset.init_busybox
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ -f /sec/config.yaml ]; then
                cp /sec/config.yaml /work/config.yaml
              else
                cp /cm/config.yaml /work/config.yaml
              fi
              chmod 644 /work/config.yaml
          volumeMounts:
            - name: riid-work
              mountPath: /work
            - name: riid-config-cm
              mountPath: /cm
            - name: riid-config-secret
              mountPath: /sec
      containers:
        - name: riid
          image: riid.daemonset.riid
          imagePullPolicy: IfNotPresent
          # No added capabilities: SYS_ADMIN/MKNOD were there for the in-pod
          # podman graph driver (overlay mounts, device nodes). The pod no
          # longer unpacks anything — every engine is a daemon on the node.
          env:
            - name: RIID_CONFIG
              value: /etc/riid/config.yaml
            # Remote podman. CONTAINER_HOST alone puts podman in client mode —
            # no --remote flag anywhere (cmd/podman/registry/remote.go:33 in
            # podman 6.1.0), so PodmanRuntimeAdapter and the bench drivers both
            # reach the node daemon without any code knowing about it.
            - name: CONTAINER_HOST
              value: unix:///run/podman/podman.sock
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: riid-work
              mountPath: /etc/riid/config.yaml
              subPath: config.yaml
            - name: dragonfly-sock
              mountPath: /var/run/dragonfly
            - name: podman-sock
              mountPath: /run/podman/podman.sock
            # Same path inside and outside: the prefix-import path hands podman
            # an `oci:<dir>` reference, and a remote podman resolves that
            # directory on the NODE. A different mountPath here would make the
            # daemon look for a directory that only exists in the pod.
            - name: riid-work-host
              mountPath: /var/lib/riid/work
      volumes:
        - name: riid-work
          emptyDir: {}
        - name: riid-config-cm
          configMap:
            name: riid-config
        - name: riid-config-secret
          secret:
            secretName: riid-config-secret
            optional: true
        - name: dragonfly-sock
          hostPath:
            path: /var/run/dragonfly
            type: DirectoryOrCreate
        - name: podman-sock
          hostPath:
            path: /run/podman/podman.sock
            type: Socket
        - name: riid-work-host
          hostPath:
            path: /var/lib/riid/work
            type: DirectoryOrCreate
