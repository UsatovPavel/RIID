apiVersion: v1
kind: ConfigMap
metadata:
  name: riid-config
  namespace: riid-system
data:
  config.yaml: |
    client:
      http:
        connectTimeout: "PT5S"
        requestTimeout: "PT30M"
        maxRetries: 2
        initialBackoff: "PT0.2S"
        maxBackoff: "PT2S"
        backoffExponentBase: 2
        retryIdempotentOnly: true
        userAgent: "riid-client"
        followRedirects: true
      partialDownloading:
        mode: AUTO
        partialDigestValidation: SKIP
        retryWithoutRangeOnUnsatisfiableRange: true
      auth:
        defaultTokenTtlSeconds: 300
        certPath: null
        keyPath: null
        caPath: null
      registries:
        - scheme: "https"
          host: "registry-1.docker.io"
          port: -1
          credentials: null
    dispatcher:
      maxConcurrentRegistry: 4
    app:
      # OCI layouts are tarred here and streamed to the node's Podman API over
      # its Unix socket; this directory does not need to exist on the node.
      tempDirectory: "/var/lib/riid/work"
      daemon:
        unixSocketPath: "/tmp/riid.sock"
        metricsHost: "0.0.0.0"
        metricsPort: 9090
        maxConcurrentPulls: 32
        requestTimeout: "PT30M"
        maxCacheBytes: 42949672960 # 40 GB
        overloadPolicy: REJECT
    p2p:
      dragonfly:
        enabled: true
        dfdaemonAddr: "unix:///var/run/dragonfly/dfdaemon.sock"
        maxRetries: 2
