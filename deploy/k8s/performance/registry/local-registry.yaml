apiVersion: v1
kind: Namespace
metadata:
  name: registry-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-registry-data
  namespace: registry-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # The 20-image partial dataset is ~11.5 GiB of blobs plus registry
      # metadata; leave room for the zstd mirror of the same set.
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-registry
  namespace: registry-system
  labels:
    app.kubernetes.io/name: local-registry
spec:
  replicas: 1
  # RWO volume: RollingUpdate deadlocks, because the new pod waits for a disk the
  # old one still holds and the old one waits for the new to be Ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: local-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-registry
    spec:
      nodeSelector:
        riid.registry: "true"
      # The registry node is tainted so nothing else lands there; the registry
      # itself, the dataset loader and the tx probe are the only tolerated pods.
      tolerations:
        - key: riid.registry
          operator: Exists
          effect: NoSchedule
      containers:
        - name: registry
          image: performance.local_registry
          imagePullPolicy: IfNotPresent
          # Both ends of this were measured on 2026-09-11. With no limit the page
          # cache from one 2.4 GiB blob filled the node's 5.86 GiB allocatable and
          # kubelet evicted the registry itself; at 4Gi the cgroup starved under a
          # riid-podman arm (10 pods x 4 concurrent fetches) until exec could not
          # even start. 5Gi bounds the cache and still leaves the node headroom.
          # No CPU limit: throttling here would land inside the measured pull.
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              memory: 5Gi
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            # Without this the dataset lives in the container's writable layer
            # and every pod restart silently empties the registry, costing a
            # ~90 minute re-mirror over the WAN before the next arm can run.
            - name: data
              mountPath: /var/lib/registry
        # bare-porto only: Porto fetches blobs over https, so a second server on the
        # same store answers TLS on 5443; porto-registry-tls.sh issues the cert.
        # Without that Secret it idles, and stands without Porto see no change.
        - name: registry-tls
          image: performance.local_registry
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - if [ -s /certs/tls.crt ]; then exec registry serve /etc/docker/registry/config.yml; else exec sleep 2147483647; fi
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5443"
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              memory: 10Gi
          ports:
            - name: https
              containerPort: 5443
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: local-registry-data
        - name: tls
          secret:
            secretName: local-registry-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: local-registry
  namespace: registry-system
  labels:
    app.kubernetes.io/name: local-registry
spec:
  selector:
    app.kubernetes.io/name: local-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
    - name: https
      port: 5443
      targetPort: https
      protocol: TCP
