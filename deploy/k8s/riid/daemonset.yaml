apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: riid
  namespace: riid-system
  labels:
    app.kubernetes.io/name: riid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: riid
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riid
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
                  - key: riid.monitoring
                    operator: DoesNotExist
      # Если Secret riid-config-secret существует, его config.yaml копируется в emptyDir; иначе — из ConfigMap riid-config.
      initContainers:
        - name: pick-riid-config
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ -f /sec/config.yaml ]; then
                cp /sec/config.yaml /work/config.yaml
              else
                cp /cm/config.yaml /work/config.yaml
              fi
              chmod 644 /work/config.yaml
          volumeMounts:
            - name: riid-work
              mountPath: /work
            - name: riid-config-cm
              mountPath: /cm
            - name: riid-config-secret
              mountPath: /sec
      containers:
        - name: riid
          image: ghcr.io/usatovpavel/riid:v0.3.8
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
                - MKNOD
          env:
            - name: RIID_CONFIG
              value: /etc/riid/config.yaml
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: riid-work
              mountPath: /etc/riid/config.yaml
              subPath: config.yaml
            - name: dragonfly-sock
              mountPath: /var/run/dragonfly
            - name: fuse-device
              mountPath: /dev/fuse
      volumes:
        - name: riid-work
          emptyDir: {}
        - name: riid-config-cm
          configMap:
            name: riid-config
        - name: riid-config-secret
          secret:
            secretName: riid-config-secret
            optional: true
        - name: dragonfly-sock
          hostPath:
            path: /var/run/dragonfly
            type: DirectoryOrCreate
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
