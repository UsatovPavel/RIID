apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: riid
  namespace: riid-system
  labels:
    app.kubernetes.io/name: riid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: riid
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riid
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      containers:
        - name: riid
          image: ghcr.io/usatovpavel/riid:v0.3.1
          imagePullPolicy: IfNotPresent
          env:
            - name: RIID_CONFIG
              value: /etc/riid/config.yaml
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: riid-config
              mountPath: /etc/riid/config.yaml
              subPath: config.yaml
            - name: dragonfly-sock
              mountPath: /var/run/dragonfly
      volumes:
        - name: riid-config
          configMap:
            name: riid-config
        - name: dragonfly-sock
          hostPath:
            path: /var/run/dragonfly
            type: DirectoryOrCreate
